name: CI/CD Pipeline for Django Project

on:
    push:
        branches:
        - main

jobs:
     build-test-deploy:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v2

        - name: Set up Python
          uses: actions/setup-python@v2
          with:
            python-version: '3.8'

        - name: Install dependencies
          run: |
            py -m pip install django
            pip install -r requirements.txt

        - name: Run tests
          run: |
            py manage.py test
        
